spring.profiles.active=local

spring.application.name=anu_jewellery
server.port=8080


spring.datasource.url=jdbc:mysql://localhost:3306/jewellery_management_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Secure JWT Placeholders
app.jwt.secret=${JWT_SECRET:DefaultSecretKeyChangeMePlease123456789VerySecureAndLongEnough2026}
app.jwt.expiration-ms=3600000

# Razorpay Placeholders
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
razorpay.currency=INR

# Admin Seeder Placeholders
app.admin.username=${ADMIN_USERNAME:admin@anujewellery.com}
app.admin.password=${ADMIN_PASSWORD:DefaultAdminPass123}