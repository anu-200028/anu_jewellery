<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products - Admin Panel</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      padding: 30px 20px;
    }
    .container {
      width: 95%;
      max-width: 1200px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    .btn-back {
      padding: 10px 18px;
      background-color: #0d6efd;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
    }
    .btn-back:hover {
      background-color: #0b5ed7;
    }
    .category-section {
      margin-bottom: 35px;
    }
    .category-title {
      background-color: #2563eb;
      color: white;
      padding: 12px 18px;
      border-radius: 8px 8px 0 0;
      font-size: 18px;
      font-weight: 600;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      border-radius: 0 0 8px 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
      vertical-align: middle;
    }
    th {
      background-color: #f8f9fa;
      color: #333;
      font-weight: 600;
    }
    tr:hover {
      background-color: #f1f5f9;
    }
    .product-img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .no-img {
      width: 50px;
      height: 50px;
      background-color: #eee;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #777;
    }
    .btn-action {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      margin-right: 5px;
    }
    .btn-edit {
      background-color: #ffc107;
      color: #212529;
    }
    .btn-edit:hover {
      background-color: #e0a800;
    }
    .btn-delete {
      background-color: #dc3545;
      color: white;
    }
    .btn-delete:hover {
      background-color: #bb2d3b;
    }
    .badge-in {
      color: #198754;
      font-weight: bold;
    }
    .badge-out {
      color: #dc3545;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <h2>All Products Inventory (Categorized)</h2>
      <a href="admin-home.html" class="btn-back">Back to Admin Home</a>
    </div>

    <!-- Container where category sections & tables will be dynamically injected -->
    <div id="categorizedProductsContainer">
      <p style="text-align: center; padding: 20px;">Loading inventory...</p>
    </div>
  </div>

<script>
async function fetchProducts() {
    const container = document.getElementById('categorizedProductsContainer'); 
    const token = localStorage.getItem('token') || localStorage.getItem('jwt');

    try {
        const response = await fetch('/api/products', {
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            }
        });

        if (!response.ok) throw new Error('Failed to load products');
        
        const products = await response.json();

        if (!products || products.length === 0) {
            container.innerHTML = '<p style="text-align:center; padding: 20px;">No products found.</p>';
            return;
        }

        // 1. Group products by their category property
        const categories = {};
        products.forEach(p => {
            const cat = p.category ? p.category.toUpperCase() : 'OTHER';
            if (!categories[cat]) {
                categories[cat] = [];
            }
            categories[cat].push(p);
        });

        let html = '';

        // 2. Loop through each category and build its dedicated section & table
        for (const [categoryName, catProducts] of Object.entries(categories)) {
            html += `
                <div class="category-section">
                    <div class="category-title">${categoryName} (${catProducts.length})</div>
                    <table>
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Occasion</th> 
                                <th>Metal / Gender</th>
                                <th>Stone Details</th>
                                <th>Stone Weight</th>
                                <th>Net Weight</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            catProducts.forEach(p => {
                const imageTd = p.imageUrl 
                    ? `<img src="${p.imageUrl}" class="product-img" alt="${p.name || 'Product'}">` 
                    : `<div class="no-img">No Img</div>`;
                
                const stoneWeightVal = (p.stoneWeight !== null && p.stoneWeight !== undefined && p.stoneWeight !== '') ? p.stoneWeight : '-';
                const netWeightVal = (p.weight !== null && p.weight !== undefined && p.weight !== '') ? p.weight : '-';

                html += `
                    <tr>
                        <td>${imageTd}</td>
                        <td><strong>${p.id}</strong></td>
                        <td>${p.name || '-'}</td>
                        <td>₹${p.price || 0}</td>
                        <td>${p.stock || 0}</td>
                        <td>${p.occasion || '-'}</td>
                        <td>${p.metalType || '-'} / ${p.gender || '-'}</td>
                        <td>${p.stoneType || 'Plain'}</td>
                        <td>${stoneWeightVal}</td>
                        <td>${netWeightVal}</td>
                        <td class="${p.stock > 0 ? 'badge-in' : 'badge-out'}">${p.stock > 0 ? 'In Stock' : 'Out of Stock'}</td>
                        <td>
                            <button onclick="editProduct('${p.id}')" class="btn-action btn-edit">Edit</button>
                            <button onclick="deleteProduct('${p.id}')" class="btn-action btn-delete">Delete</button>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;
        }
        
        container.innerHTML = html;
    } catch (error) {
        console.error('Error fetching inventory:', error);
        container.innerHTML = '<p style="text-align:center; color:red; padding: 20px;">Failed to load products.</p>';
    }
}

function editProduct(id) {
    window.location.href = `edit-product.html?id=${id}`;
}

async function deleteProduct(id) {
    if (confirm(`Are you sure you want to remove Product ID ${id}?`)) {
        const token = localStorage.getItem('token') || localStorage.getItem('jwt');
        try {
            const response = await fetch(`/api/products/${id}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                alert('Product successfully removed!');
                fetchProducts();
            } else {
                alert('Failed to delete product.');
            }
        } catch (error) {
            console.error('Delete error:', error);
            alert('Could not connect to backend server.');
        }
    }
}

document.addEventListener('DOMContentLoaded', fetchProducts);
</script>

</body>
</html>
