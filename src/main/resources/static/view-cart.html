<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>View Cart - Anu Jewellery</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container wide-container">
    <h1>My Cart</h1>
    <p id="welcomeText"></p>

    <div class="actions">
      <button onclick="goBackToShopping()">Back to Shopping</button>
    </div>

    <div id="cartList"></div>
    <h3 id="cartTotal"></h3>
    <button id="checkoutBtn" onclick="checkout()">Proceed to Buy</button>
  </div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="/js/customer.js"></script>
  <script>
    // --- CHECKOUT HANDLER ---
    async function checkout() {
      try {
        // 1. FRONTEND CHECK: Check if the cart UI/container is empty before making the call
        const cartList = document.getElementById("cartList");
        if (!cartList || cartList.children.length === 0 || cartList.innerText.includes("Nothing is in the cart")) {
          alert("Your cart is empty! Please add items before proceeding to buy.");
          return; // Stop execution, don't hit backend or logout
        }

        const response = await fetch("/customer/payment/create-order", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + localStorage.getItem("token")
          }
        });

        // 2. CHECK FOR EMPTY CART / BAD REQUEST FROM BACKEND (Status 400)
        if (response.status === 400) {
          const errorMsg = await response.text();
          alert(errorMsg || "Your cart is empty. Cannot proceed to payment.");
          return; // Prevents reaching the 401/403 logout check
        }

        // 3. CHECK FOR AUTHENTICATION ERRORS (Status 401 or 403)
        if (response.status === 401 || response.status === 403) {
          alert("Session expired or access denied. Please log in again.");
          logout();
          return;
        }

        if (!response.ok) {
          alert("Could not create payment order. Please try again.");
          return;
        }

        const order = await response.json();
        console.log("Order created:", order);

        const options = {
          key: order.keyId,
          amount: order.amount,
          currency: order.currency || "INR",
          name: "Anu Jewellery",
          description: "Purchase from Cart",
          order_id: order.razorpayOrderId,
          handler: async function (response) {
            try {
              const verifyResponse = await fetch("/customer/payment/verify", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + localStorage.getItem("token")
                },
                body: JSON.stringify({
                  razorpayPaymentId: response.razorpay_payment_id,
                  razorpayOrderId: response.razorpay_order_id,
                  razorpaySignature: response.razorpay_signature
                })
              });

              if (verifyResponse.ok) {
                alert("Payment successful! Your order has been placed.");
                window.location.href = "index.html";
              } else {
                alert("Payment verification failed.");
              }
            } catch (err) {
              console.error("Verification error:", err);
              alert("An error occurred during payment verification.");
            }
          },
          theme: {
            color: "#7e22ce"
          }
        };

        const rzp = new Razorpay(options);
        rzp.open();

      } catch (error) {
        console.error("Checkout error:", error);
        alert("Could not initiate payment. Please try again.");
      }
    }
  </script>
</body>
</html>
