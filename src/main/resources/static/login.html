<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - Anu Jewellery</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    
   <form id="loginForm" autocomplete="off">

      <div style="margin-bottom: 15px;">
        <input type="text" id="username" name="userInput" placeholder="Username" autocomplete="off" required style="width: 100%; padding: 10px; box-sizing: border-box;" />
      </div>

      <div style="margin-bottom: 15px;">
        <input type="password" id="password" name="passInput" placeholder="Password" autocomplete="new-password" required style="width: 100%; padding: 10px; box-sizing: border-box;" />
      </div>

      <!-- Side-by-side buttons row -->
      <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button type="submit" style="flex: 1; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Login</button>
        <button type="button" onclick="location.href='index.html'" style="flex: 1; padding: 10px; background: #64748b; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Back</button>
      </div>
    </form>

    <!-- Clearly visible sign-up prompt -->
    <div style="text-align: center; font-size: 14px; color: #334155;">
      If not signed in? <a href="signup.html" style="color: white; text-decoration: underline; font-weight: bold;">Sign up here</a>
    </div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
